name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR 连推时取消旧运行省额度；main 上不取消——跑到一半被掐掉会留下「有 tag 没 Release」
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: 构建 CC-DEL.exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: src/go.mod

      # 脚本是主要逻辑，先做语法检查，避免打出一个跑不起来的 exe
      - name: 检查 PowerShell 脚本语法
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/src/CC-DEL.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) {
            $errs | ForEach-Object {
              Write-Host "::error file=src/CC-DEL.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host '语法检查通过'

      # 版本号：tag 推送用 tag 本身；否则「日期.当天第几个」——同一天第一次是 .0
      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.Substring(1)
            Write-Host "tag 推送，直接用 tag 版本"
          } else {
            $date = Get-Date -Format 'yyyyMMdd'
            # 当天已有的 tag 决定下一个序号。同分支的多次运行被 concurrency 串行化，
            # 所以不会出现两次运行抢到同一个号。
            $nums = @()
            foreach ($line in (git ls-remote --tags --refs origin "refs/tags/v$date.*" 2>$null)) {
              if ($line -match "/v$date\.(\d+)$") { $nums += [int]$Matches[1] }
            }
            $n = 0
            if ($nums.Count -gt 0) { $n = ($nums | Measure-Object -Maximum).Maximum + 1 }
            $v = "$date.$n"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本：$v"

      - name: 检查资源文件
        shell: pwsh
        run: |
          # 每个 .syso 都带一个 .rsrc 段，多一个就会报 "too many .rsrc sections"
          $syso = @(Get-ChildItem src -Filter *.syso)
          if ($syso.Count -ne 1) {
            throw "src 目录应恰好有 1 个 .syso，实际 $($syso.Count) 个：$(($syso.Name) -join ', ')"
          }
          Write-Host "资源文件：$($syso[0].Name)（$($syso[0].Length) 字节）"
          if (-not (Test-Path src/logo.ico)) { throw "缺少 src/logo.ico" }

      - name: 编译
        working-directory: src
        shell: pwsh
        run: |
          # 图标资源 rsrc.syso 已随仓库提交，因此不需要 runner 上有 windres
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=${{ steps.ver.outputs.version }}" -o ../CC-DEL.exe .
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }
          Get-Item ../CC-DEL.exe | ForEach-Object { Write-Host ("产物 " + $_.Length + " 字节") }

      # 编出一个没图标、或者带控制台黑窗的 exe，是这里最容易悄悄发生的事，卡一道
      - name: 校验图标与子系统
        shell: pwsh
        run: |
          # 不用 ExtractAssociatedIcon：图标缺失时它照样返回一个"通用程序图标"，看着有值。
          # 直接数 PE 资源目录里的 RT_GROUP_ICON(14) / RT_ICON(3)，再读 PE 头的 Subsystem。
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PeRes
          {
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
              private static extern IntPtr LoadLibraryExW(string f, IntPtr r, uint flags);
              private delegate bool EnumProc(IntPtr h, IntPtr t, IntPtr n, IntPtr p);
              [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
              private static extern bool EnumResourceNamesW(IntPtr h, IntPtr type, EnumProc cb, IntPtr p);
              public static int Count(string path, int type)
              {
                  IntPtr h = LoadLibraryExW(path, IntPtr.Zero, 2);
                  if (h == IntPtr.Zero) return -1;
                  int n = 0;
                  EnumResourceNamesW(h, (IntPtr)type, delegate (IntPtr a, IntPtr b, IntPtr c, IntPtr d)
                  {
                      n++;
                      return true;
                  }, IntPtr.Zero);
                  return n;
              }
          }
          '@

          $exe = Join-Path $PWD 'CC-DEL.exe'
          $groups = [PeRes]::Count($exe, 14)
          $frames = [PeRes]::Count($exe, 3)
          Write-Host "RT_GROUP_ICON=$groups  RT_ICON=$frames"
          if ($groups -lt 1) {
            throw "exe 里没有图标资源：rsrc.syso 没参与链接（是不是退回去用了单文件模式 go build launcher.go？）"
          }
          if ($frames -lt 3) {
            throw "图标只有 $frames 帧：ico 里必须有多尺寸，否则小图标会被缩糊"
          }

          $fs = [System.IO.File]::OpenRead($exe)
          try {
            $br = New-Object System.IO.BinaryReader($fs)
            $fs.Position = 0x3C
            $pe = $br.ReadInt32()
            $fs.Position = $pe + 0x5C
            $sub = $br.ReadUInt16()
          } finally { $fs.Dispose() }
          $subText = if ($sub -eq 2) { 'Windows GUI' } elseif ($sub -eq 3) { 'Console' } else { "未知($sub)" }
          Write-Host "子系统：$subText"
          if ($sub -ne 2) { throw "子系统不是 GUI（$subText）：编译时漏了 -H windowsgui，双击会带黑窗" }

      # 19 项回归测试：能算通过，才谈得上"能用"
      - name: 自检
        shell: pwsh
        run: |
          $out = & .\CC-DEL.exe -SelfTest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "自检未通过（退出码 $LASTEXITCODE）" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: CC-DEL-${{ steps.ver.outputs.version }}-windows-x64
          path: CC-DEL.exe
          if-no-files-found: error

  # 构建通过就自动打 tag 发 Release：main 上每个通过的提交一个版本，不用手动敲 tag
  publish:
    name: 打 tag 并发布
    needs: windows
    # PR 不发布；tag 推送（别人手动打的）也补发一次 Release；构建没过就不碰
    if: |
      needs.windows.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: CC-DEL-${{ needs.windows.outputs.version }}-windows-x64
          path: dist

      - name: 打 tag
        id: tag
        shell: pwsh
        run: |
          $ver = "${{ needs.windows.outputs.version }}"
          $tag = "v$ver"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # 本次就是 tag 推送，tag 已经在远端了，直接拿它发 Release
            Write-Host "本次为 tag 推送，直接发布 $tag"
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "create=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          # 重跑同一个 workflow 时 RUN 号不变，算出来的版本可能已经打过了：
          # 那种情况不重复发 Release，免得同一版本出现两份。
          $exists = git ls-remote --tags --refs origin "refs/tags/$tag"
          if ($exists) {
            Write-Host "::warning::$tag 已存在，跳过发布（重跑任务或版本号撞了）"
            "create=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "CC-DEL $ver"
          git push origin "refs/tags/$tag"
          # 用 GITHUB_TOKEN 推的 tag 不会再次触发本 workflow，所以不会自己套娃
          Write-Host "已推送 tag $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "create=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 发布 Release
        if: steps.tag.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CC-DEL ${{ needs.windows.outputs.version }}
          files: dist/CC-DEL.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
