name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: 构建 CC-DEL.exe
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: src/go.mod

      # 脚本是主要逻辑，先做语法检查，避免打出一个跑不起来的 exe
      - name: 检查 PowerShell 脚本语法
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/src/CC-DEL.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) {
            $errs | ForEach-Object {
              Write-Host "::error file=src/CC-DEL.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
            }
            exit 1
          }
          Write-Host '语法检查通过'

      - name: 计算版本号
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = (Get-Date -Format 'yyyyMMdd') + '.' + $env:GITHUB_RUN_NUMBER
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本：$v"

      - name: 编译
        working-directory: src
        shell: pwsh
        run: |
          # 图标资源 rsrc.syso 已随仓库提交，因此不需要 runner 上有 windres
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=${{ steps.ver.outputs.version }}" -o ../CC-DEL.exe .
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }
          Get-Item ../CC-DEL.exe | ForEach-Object { Write-Host ("产物 " + $_.Length + " 字节") }

      # 19 项回归测试：能算通过，才谈得上"能用"
      - name: 自检
        shell: pwsh
        run: |
          $out = & .\CC-DEL.exe -SelfTest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "自检未通过（退出码 $LASTEXITCODE）" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CC-DEL-${{ steps.ver.outputs.version }}-windows-x64
          path: CC-DEL.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CC-DEL.exe
          generate_release_notes: true
